<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 112" width="960" height="112" role="img" aria-labelledby="t">
  <title id="t">µID bit layout: bits 95-32 Unix nanoseconds, 31-16 random, 15-0 CRC-16</title>

  <!-- bit numbers, most significant bit first -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#57606a">
    <text x="24" y="22" text-anchor="start">95</text>
    <text x="629.5" y="22" text-anchor="middle">32|31</text>
    <text x="783.5" y="22" text-anchor="middle">16|15</text>
    <text x="936" y="22" text-anchor="end">0</text>
  </g>

  <!-- fields, widths proportional to 64:16:16 bits -->
  <rect x="24.5" y="32.5" width="603" height="49" rx="3" fill="#dde7f3" stroke="#9fbbdb"/>
  <rect x="631.5" y="32.5" width="150" height="49" rx="3" fill="#dcecdd" stroke="#a2c7a6"/>
  <rect x="785.5" y="32.5" width="150" height="49" rx="3" fill="#f6e9d0" stroke="#d5bb8b"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="326" y="53" font-size="15" fill="#1c3d5f">Unix nanoseconds, unsigned</text>
    <text x="706.5" y="53" font-size="15" fill="#1c4429">Random</text>
    <text x="860.5" y="53" font-size="15" fill="#5a4213">CRC-16</text>
    <g font-size="11.5" fill="#57606a">
      <text x="326" y="70">64 bits</text>
      <text x="706.5" y="70">16 bits</text>
      <text x="860.5" y="70">16 bits</text>
    </g>
  </g>

  <!-- byte ruler, 12 bytes -->
  <path d="M99.5 86v6M175 86v6M250.5 86v6M326 86v6M401.5 86v6M477 86v6M552.5 86v6M706.5 86v6M860.5 86v6"
        stroke="#c8d1da" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#8c959f" text-anchor="middle">
    <text x="61.75" y="105">0</text>
    <text x="137.25" y="105">1</text>
    <text x="212.75" y="105">2</text>
    <text x="288.25" y="105">3</text>
    <text x="363.75" y="105">4</text>
    <text x="439.25" y="105">5</text>
    <text x="514.75" y="105">6</text>
    <text x="590.25" y="105">7</text>
    <text x="668.75" y="105">8</text>
    <text x="744.25" y="105">9</text>
    <text x="822.75" y="105">10</text>
    <text x="898.25" y="105">11</text>
  </g>
</svg>
